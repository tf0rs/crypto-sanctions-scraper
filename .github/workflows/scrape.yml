name: scrape-crypto-sanctions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "app/uv.lock"
      - run: uv sync --locked
        working-directory: app
      - run: |
          set -o pipefail
          uv run python scraper.py | tee ../run_output.txt
        working-directory: app
      - name: Commit updated data
        # Sources run independently now (see scraper.py) — one failing
        # shouldn't discard data the others successfully collected. The
        # scrape step explicitly sets `pipefail` (omitting `shell:` on Linux
        # runs `bash -e` without `pipefail`, which let `tee` mask scraper
        # failures as green runs) so any source failure marks the run red.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sanctions.db
          if ! git diff --cached --quiet; then
            { echo "Update sanctions data $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo; cat run_output.txt; } > commit_message.txt
            git commit -F commit_message.txt
            git push
          fi
